  const shrink=Math.min(1,OPD_HW/Math.max(1,(r-l)/2*K0),OPD_HH/Math.max(1,(b-t)/2*K1)); // solo se reduce si el propio clip no cabe; lo que sobresale (rayos, destellos) queda fuera de pantalla sin achicar el resto
  const nOut=list.filter(t=>t.verts.every(v=>Math.abs(v.X)>OPD_HW||Math.abs(v.Y)>OPD_HH)).length,nPart=list.filter(t=>t.verts.some(v=>Math.abs(v.X)>OPD_HW||Math.abs(v.Y)>OPD_HH)).length-nOut;
  for(const t of list)for(const v of t.verts){v.X=clamp(v.X*shrink);v.Y=clamp(v.Y*shrink)}
  let ax0=1e9,ax1=-1e9,ay0=1e9,ay1=-1e9;for(const t of list)for(const v of t.verts){ax0=Math.min(ax0,v.X);ax1=Math.max(ax1,v.X);ay0=Math.min(ay0,v.Y);ay1=Math.max(ay1,v.Y)}
  const pc=(v,hh)=>Math.round((v+hh)/(2*hh)*100),areaTxt=list.length?` · ocupa en la pantalla de OPD: X ${pc(ax0,4096)}–${pc(ax1,4096)} %, Y ${pc(ay0,3584)}–${pc(ay1,3584)} % (ancho ${ax1-ax0}, alto ${ay1-ay0} unidades)`:'';
  const data={format:'opd-objects',version:1,fmt:'opd',file:fileName,block:0,kinds:['textures'],textures:list};
  const stem=fileName.replace(/\.[^.]+$/,'')+'_'+clip.name+'_f'+curFrame;
  const jn=await saveJsonAs(stem+'_texturas.json',JSON.stringify(data,null,1));
  if(!jn){status('Exportación cancelada.');return}
  const jdir=server?(pickViaServer?dirOf(jn):dirPath):null;
  for(const [,u] of used){const blob=await texToBlob(u.tx),bytes=new Uint8Array(await blob.arrayBuffer());
    if(server&&jdir)await srvWrite(joinPath(jdir,u.png),bytes);else await saveOut(u.png,bytes,'image/png')}
  status(`Exportado ${list.length} texturas de ${clip.name} (fotograma ${curFrame}) → ${jn}; atlas PNG: ${[...used.values()].map(u=>u.png).join(', ')}`+(skipped?` · ${skipped} imágenes invisibles omitidas`:'')+areaTxt+(nOut+nPart?` · ${nOut} imágenes quedan fuera de la pantalla de OPD y ${nPart} sobresalen (ej. rayos o destellos que el juego recorta con máscara; ocúltalos con H antes de exportar si no los quieres)`:'')+(shrink<1?` · se redujo al ${Math.round(shrink*100)}% para entrar en la pantalla de OPD`:'')+(add?` · ${add} usan mezcla aditiva (OPD no la tiene)`:''));
}

async function readBuf(name,u8){const u=await unwrap(u8);return {name,txp:u.txp,wrap:u.wrap,T:parseTxp2(u.txp)}}
async function readOne(f){return readBuf(f.name,new Uint8Array(await f.arrayBuffer()))}
function afterOpen(){

/* ---------- carpeta completa ---------- */
let dirRecs=[],dirName='',dirFilter='',curRec=null,server=false,dirPath='';
const CODES=['Pes','Ucl','Uel','Acl','Ccl','Ccs','Crs','Usc'];
function codeOf(n){const m=/(Pes|Ucl|Uel|Acl|Ccl|Ccs|Crs|Usc)/.exec(n);return m?m[1]:''}
function libsFor(main){const c=codeOf(main.name);
  const rank=n=>codeOf(n)===c?(/^licenceTexture/i.test(n)?0:1):2; // licenceTexture<mismo código> primero
  return dirRecs.filter(r=>r!==main&&r.T.regions.length).sort((a,b)=>(rank(a.name)-rank(b.name))||a.name.localeCompare(b.name)).map(r=>({name:r.name,T:r.T}))}
function useRec(r){
  if(dirty&&!confirm('Hay cambios sin guardar en '+fileName+'. ¿Cambiar de archivo igualmente?'))return;
  fileBuf=r.txp;wrapInfo=r.wrap;fileName=r.name;T=r.T;curRec=r;libs=libsFor(r);tcache.clear();
  afterOpen();
  status(`${fileName}${wrapInfo?' (envoltorio zlib)':''} — ${T.clips.length} clips, ${T.regions.length} regiones, ${T.tex.length} texturas · texturas compartidas de ${libs.length} archivos de la carpeta`);
}
function buildDir(){const p=$('pDir');
  if(!dirRecs.length){p.innerHTML='<div class="note">Con «Abrir carpeta…» se cargan todos los .bin de una carpeta (por ejemplo licence). Al elegir uno de la lista, las texturas de los demás quedan disponibles para dibujarlo.</div>';return}
  p.innerHTML=`<div class="note">${dirName}: ${dirRecs.length} archivos. Clic para abrir uno como principal.</div><input id="dirF" placeholder="filtrar por nombre" value="${dirFilter}" style="width:100%;margin:4px 0">`+
  '<div id="dirL"></div>';
  $('dirF').oninput=e=>{dirFilter=e.target.value;fillDir()};fillDir()}
function fillDir(){const L=$('dirL'),q=dirFilter.toLowerCase();L.innerHTML='';
  for(const r of dirRecs){if(q&&!r.name.toLowerCase().includes(q))continue;
    const d=document.createElement('div');d.className='row'+(r.T===T?' sel':'');
    d.innerHTML=`<span>${r.name}</span><span class="k">${r.T.clips.length} clips · ${r.T.regions.length} reg · ${r.T.tex.length} tex</span>`;
    d.onclick=()=>{useRec(r);buildDir()};L.appendChild(d)}}
$('bDir').onclick=()=>$('fDir').click();
async function finishFolder(recs,bad,label,sel){
  if(!recs.length){alert('No se pudo leer ningún archivo');return}
  recs.sort((a,b)=>a.name.localeCompare(b.name));
  dirRecs=recs;dirName=label;dirFilter='';
  const m=(sel&&recs.find(r=>r.name===sel))||recs.find(r=>/^game2dPes3\./i.test(r.name))||recs.find(r=>r.T.clips.length)||recs[0];
  dirty=false;useRec(m);buildDir();
  document.querySelector('.tabs button[data-t=dir]').click();
  status($('status').textContent+` · ${recs.length} archivos leídos`+(bad.length?`, no se pudieron leer: ${bad.join(', ')}`:''));
}
$('fDir').onchange=async e=>{
  const fs=[...e.target.files].filter(f=>/\.(bin|apk)$/i.test(f.name));e.target.value='';
  if(!fs.length){alert('La carpeta no tiene archivos .bin');return}
  const recs=[],bad=[];let i=0;
  for(const f of fs){status(`Leyendo carpeta… ${++i}/${fs.length} ${f.name}`);await new Promise(r=>setTimeout(r));
    try{recs.push(await readOne(f))}catch(err){bad.push(f.name)}}
  await finishFolder(recs,bad,(fs[0].webkitRelativePath||'').split('/')[0]||'carpeta');
};
/* ---------- modo servidor local (EditorAFP Servidor.ps1): archivos directos del disco ---------- */
const joinPath=(d,n)=>d.replace(/[\\/]+$/,'')+'\\'+n, dirOf=p=>p.slice(0,Math.max(p.lastIndexOf('\\'),p.lastIndexOf('/')));
async function srvWrite(path,bytes){const r=await fetch('/api/write?p='+encodeURIComponent(path),{method:'POST',body:bytes});if(!r.ok)throw new Error('No se pudo escribir '+path+' ('+r.status+' '+await r.text()+')')}
async function srvPick(route,start){const r=await fetch(route+(start?'?start='+encodeURIComponent(start):''),{method:'POST'});if(r.status===204)return null;if(!r.ok)throw new Error(await r.text());return (await r.json()).path}
async function srvPickSave(name,start){const r=await fetch('/api/picksave?name='+encodeURIComponent(name)+(start?'&start='+encodeURIComponent(start):''),{method:'POST'});if(r.status===204)return null;if(!r.ok){const t=await r.text();throw new Error('El servidor no pudo abrir «Guardar como» (HTTP '+r.status+(t?': '+t:'')+'). Cerrá «EditorAFP run.bat» y volvé a abrirlo para cargar el .ps1 nuevo.')}return (await r.json()).path}
async function srvOpenDir(dir,sel){
  const L=await (await fetch('/api/list?p='+encodeURIComponent(dir))).json(),names=L.files.filter(f=>/\.(bin|apk)$/i.test(f)).sort();
  if(!names.length){alert('La carpeta no tiene archivos .bin');return}
  const recs=[],bad=[];let i=0;dirPath=dir;
  for(const n of names){status(`Leyendo ${dir}… ${++i}/${names.length} ${n}`);await new Promise(r=>setTimeout(r));
    try{const r=await fetch('/api/read?p='+encodeURIComponent(joinPath(dir,n)));if(!r.ok)throw new Error(r.status);const rec=await readBuf(n,new Uint8Array(await r.arrayBuffer()));rec.path=joinPath(dir,n);recs.push(rec)}catch(err){bad.push(n)}}
  await finishFolder(recs,bad,dir.split(/[\\/]/).pop()||dir,sel);
}
fetch('/api/ping').then(r=>r.text()).then(t=>{if(t!=='editorafp')return;server=true;
